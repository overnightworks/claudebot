name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
      - name: Create the virtual environment
        run: uv venv
      - name: Install runtime dependencies
        run: uv pip install -r requirements.txt
      - name: Install test dependencies
        run: uv pip install --group dev
      - name: Run tests with coverage
        run: .venv/bin/python -m pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  sonar:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-report
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan step above blocks on the analysis (sonar.qualitygate.wait=true
      # in sonar-project.properties), so the report this reads is already
      # final. The quality gate itself passes on ratings (A/B/C), not on "0
      # findings" (issue #143 in agent-claim); this queries the API directly
      # for that stronger bar and fails loud, with the list, when it is not
      # met. The project is private, so the request authenticates with
      # SONAR_TOKEN as the HTTP basic auth user name and an empty password.
      - name: SonarCloud open findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          component_key="$(sed -n 's/^sonar\.projectKey=//p' sonar-project.properties)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            scope_query="pullRequest=${PULL_REQUEST_NUMBER}"
          else
            scope_query="branch=main"
          fi
          python3 - "${component_key}" "${scope_query}" <<'PYTHON'
          import base64
          import json
          import os
          import sys
          import urllib.request

          component_key, scope_query = sys.argv[1], sys.argv[2]
          auth_header = "Basic " + base64.b64encode(f'{os.environ["SONAR_TOKEN"]}:'.encode()).decode()

          class NoRedirectHandler(urllib.request.HTTPRedirectHandler):
              # A redirect off sonarcloud.io would carry the Authorization
              # header to whatever host it names; refuse to follow one instead.
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirectHandler)

          def fetch_page(page: int) -> dict:
              url = (
                  "https://sonarcloud.io/api/issues/search"
                  f"?componentKeys={component_key}&{scope_query}&statuses=OPEN,CONFIRMED,REOPENED&ps=100&p={page}"
              )
              request = urllib.request.Request(url, headers={"Authorization": auth_header})
              with opener.open(request) as response:
                  return json.load(response)

          page = 1
          printed = 0
          total = None
          while total is None or printed < total:
              report = fetch_page(page)
              total = report["total"]
              for issue in report["issues"]:
                  file_path = issue["component"].split(":", 1)[1]
                  line = issue.get("line", "?")
                  print(f'{issue["rule"]} {file_path}:{line} {issue["message"]}')
                  printed += 1
              if not report["issues"]:
                  break
              page += 1

          if total > 0:
              print(f"{total} open SonarCloud finding(s) in scope {scope_query}", file=sys.stderr)
              sys.exit(1)
          PYTHON
