name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor `requires-python = ">=3.12"` admits, and the interpreter
        # the live agent-telegram.service runs.
        python-version: ['3.12', '3.14']
        include:
          # Coverage travels to SonarCloud from the live service's interpreter
          # only, so the artifact name stays unique and the scan has one
          # source. The flag rides the entry so the two cannot drift apart.
          - python-version: '3.14'
            uploads-coverage: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Check the root layout
        run: python3 scripts/check_root_layout.py
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --no-build --group dev
      - name: Run tests with coverage
        run: .venv/bin/python -m pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ matrix.uploads-coverage }}
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  sonar:
    needs: check
    runs-on: ubuntu-latest
    # The repository is private and the org SONAR_TOKEN secret is not
    # delivered to it; SonarCloud's Automatic Analysis covers it instead.
    # Every step below arms itself once SONAR_TOKEN is set (repository turns
    # public, or carries the secret), at which point the head switches
    # Automatic Analysis back off.
    env:
      SONAR_ENABLED: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      # Unguarded: a green sonar job must visibly say whether it actually
      # scanned or deliberately skipped, not just "green because every step
      # was conditioned away".
      - name: Report skip when no SONAR_TOKEN is configured
        if: ${{ env.SONAR_ENABLED != 'true' }}
        run: "echo '::notice::SonarCloud scan skipped: no SONAR_TOKEN configured'"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        if: ${{ env.SONAR_ENABLED == 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        if: ${{ env.SONAR_ENABLED == 'true' }}
        with:
          name: coverage-report
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        if: ${{ env.SONAR_ENABLED == 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The gate the scan waits on grades ratings, so this step asks the API
      # for open findings itself. How it asks — the scoped query, the proof
      # that the scope resolves before a zero reads as clean, the credential
      # that never leaves a header — is owned by the script, where it is
      # scanned and covered like the rest of this repository.
      - name: SonarCloud open findings
        if: ${{ env.SONAR_ENABLED == 'true' }}
        # The script bounds each call; this is the hard ceiling, because it
        # pages and a per-call bound multiplies.
        timeout-minutes: 5
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/sonar_findings_gate.py
