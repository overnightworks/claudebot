[project]
name = "claudebot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22,<23",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "--cov=claudebot --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # The process entry in src/claudebot/telegram_bot.py only wires the real
    # Telegram polling loop; it has no branching logic worth a unit test.
    "if __name__ == .__main__.:",
]
