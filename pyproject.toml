[project]
name = "claudebot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22,<23",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=agent_bridge --cov=telegram_bot --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # telegram_bot.py's process entry only wires the real Telegram polling
    # loop; it has no branching logic worth a unit test.
    "if __name__ == .__main__.:",
]
