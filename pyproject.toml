[project]
name = "claudebot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22,<23",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
# check_root_layout under scripts/ is measured like the package: it is the
# check CI runs, so a change there is new code the coverage floor holds too.
addopts = "--cov=claudebot --cov=check_root_layout --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=100"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # Imports for the type checker never run, by design.
    "if TYPE_CHECKING:",
    # The process entry in src/claudebot/telegram_bot.py only wires the real
    # Telegram polling loop; it has no branching logic worth a unit test.
    "if __name__ == .__main__.:",
]
