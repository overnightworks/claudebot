sonar.organization=overnightworks
sonar.projectKey=overnightworks_claudebot

# Read by the CI scanner only. While this repository is private and without
# the organisation's SONAR_TOKEN, SonarCloud's Automatic Analysis produces the
# report instead (see the `sonar` job in .github/workflows/ci.yml) and ignores
# this file, so every setting below takes effect from the moment that scanner
# arms.

# `sonar.sources` is an allowlist, so a path missing here can never raise a
# finding nor clear one. `scripts` carries analysed code the coverage floor
# holds too (pyproject: --cov=check_root_layout); `.github/workflows` carries
# the file that runs with this repository's credentials on every push, which
# is code by that fact alone. The workflow directory is named rather than
# `.github`, so issue templates and other prose stay out without needing an
# exclusion. `deploy` holds only the systemd unit, which no analyser parses.
sonar.sources=src,scripts,.github/workflows
sonar.tests=tests
sonar.exclusions=**/__pycache__/**
sonar.python.version=3.12,3.14
sonar.python.coverage.reportPaths=coverage.xml

# The zero-findings gate ("SonarCloud open findings" step in
# .github/workflows/ci.yml) queries the analysis right after this scan posts
# it; without waiting, that query can race a still-processing report and read
# stale (or absent) results.
sonar.qualitygate.wait=true
